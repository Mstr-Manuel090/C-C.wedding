<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chinaza & Chikezie Wedding</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        overflow: hidden;
      }

      .title-font {
        font-family: "Cormorant Garamond", serif;
      }

      .hero-bg {
        animation: zoomHero 18s ease-in-out infinite alternate;
      }

      @keyframes zoomHero {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.1);
        }
      }

      .fade-up {
        opacity: 0;
        transform: translateY(40px);
        animation: fadeUp 1.4s ease forwards;
      }

      .fade-delay {
        opacity: 0;
        transform: translateY(40px);
        animation: fadeUp 1.4s ease forwards;
        animation-delay: 0.5s;
      }

      .fade-delay2 {
        opacity: 0;
        transform: translateY(40px);
        animation: fadeUp 1.4s ease forwards;
        animation-delay: 1s;
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .glow-btn {
        box-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
      }

      .glow-btn:hover {
        box-shadow: 0 0 40px rgba(34, 197, 94, 0.7);
      }

      .floating {
        animation: floating 4s ease-in-out infinite;
      }

      @keyframes floating {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
    </style>
  </head>

  <body>
    <!-- HERO SECTION -->
    <section class="relative h-screen w-full overflow-hidden">
      <!-- BACKGROUND IMAGE -->
      <div class="absolute inset-0 hero-bg">
        <img
          src="IMG_0038.jpg"
          alt="Couple"
          class="w-full h-full object-cover"
        />
      </div>

      <!-- OVERLAY -->
      <div class="absolute inset-0 bg-black/60"></div>

      <!-- BLUR LIGHTS -->
      <div
        class="absolute top-0 left-0 w-96 h-96 bg-green-500/20 blur-3xl rounded-full"
      ></div>
      <div
        class="absolute bottom-0 right-0 w-96 h-96 bg-yellow-400/10 blur-3xl rounded-full"
      ></div>

      <!-- CONTENT -->
      <div class="relative z-10 flex items-center justify-center h-full px-6">
        <div
          class="text-center text-white max-w-4xl bg-black/20 rounded-[40px] p-10 md:p-16"
        >
          <p
            class="uppercase tracking-[0.4em] text-sm md:text-base mb-5 fade-up text-green-300"
          >
            Wedding Ceremony
          </p>

          <h1
            class="title-font text-6xl md:text-8xl font-semibold fade-delay leading-tight"
          >
            Chinaza
            <span class="text-green-400">&</span>
            Chikezie
          </h1>

          <p class="mt-6 text-lg md:text-2xl font-light fade-delay2">
            Request the honour of your presence at their wedding celebration
          </p>

          <div class="mt-10 fade-delay2">
            <a
              href="program.html"
              class="glow-btn inline-block bg-green-500 hover:bg-green-400 transition-all duration-500 text-white px-10 py-4 rounded-full text-lg font-medium hover:scale-105"
            >
              View Wedding Program
            </a>
          </div>
        </div>
      </div>

      <!-- SCROLL ICON -->
      <div
        class="absolute bottom-8 left-1/2 -translate-x-1/2 text-white floating"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-8 h-8"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </div>
    </section>
  </body>
</html>
